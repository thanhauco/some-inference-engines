[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-engines"
version = "0.1.0"
description = "vLLM, SGLang, TensorRT-LLM or Ollama? Runnable explanations, a unified client, a benchmark harness and a decision framework."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Thanh", email = "thanhauco@gmail.com" }, { name = "Claude" }]
dependencies = ["httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# The engines themselves are heavy and hardware specific; install only the one you run.
vllm = ["vllm"]
sglang = ["sglang[all]"]
tensorrt-llm = ["tensorrt-llm"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
